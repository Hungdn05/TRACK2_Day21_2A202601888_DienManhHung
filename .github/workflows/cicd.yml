name: Income Model CI/CD
run-name: Income Model CI/CD (${{ inputs.demo_mode || 'normal' }})

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:
    inputs:
      demo_mode:
        description: 'Normal deploy or a safe quality-gate demonstration'
        required: true
        default: normal
        type: choice
        options:
          - normal
          - below-threshold
          - regression

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      candidate_key: ${{ steps.upload_candidate.outputs.candidate_key }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.STORAGE_CREDENTIALS }}' > sa-key.json
          gcloud auth activate-service-account --key-file=sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/sa-key.json" >> "$GITHUB_ENV"

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Select parameters for this run
        env:
          DEMO_MODE: ${{ inputs.demo_mode || 'normal' }}
        run: |
          python - <<'PYEOF'
          import os
          from pathlib import Path
          import yaml

          demo_params = {
              "below-threshold": {
                  "n_estimators": 1,
                  "learning_rate": 0.01,
                  "max_depth": 1,
              },
              "regression": {
                  "n_estimators": 100,
                  "learning_rate": 0.1,
                  "max_depth": 3,
              },
          }
          mode = os.environ["DEMO_MODE"]
          if mode in demo_params:
              path = Path("/tmp/income-demo-params.yaml")
              path.write_text(yaml.safe_dump(demo_params[mode]), encoding="utf-8")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"PARAMS_PATH={path}\n")
              print(f"Using safe demonstration parameters for mode={mode}")
          else:
              print("Using production parameters from params.yaml")
          PYEOF

      - name: Check training data distribution
        run: python -m src.check_data data/train_batch1.csv

      - name: Train model and create reports
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_EXPERIMENT_NAME: income-model-cicd
        run: python src/train.py

      - name: Show precision and recall report
        run: |
          test -s outputs/detail.txt
          cat outputs/detail.txt

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      - name: Upload candidate model to Cloud Storage
        id: upload_candidate
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          CANDIDATE_KEY: artifacts/candidates/${{ github.sha }}/${{ github.run_id }}/model.joblib
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ["ARTIFACT_BUCKET"])
          candidate_key = os.environ["CANDIDATE_KEY"]
          bucket.blob(candidate_key).upload_from_filename("models/model.joblib")
          print(f"Uploaded candidate model to gs://{bucket.name}/{candidate_key}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_key={candidate_key}\n")
          PYEOF

      - name: Save training reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-output-${{ github.run_id }}
          path: |
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download training reports
        uses: actions/download-artifact@v4
        with:
          name: training-output-${{ github.run_id }}
          path: outputs

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.STORAGE_CREDENTIALS }}' > sa-key.json
          gcloud auth activate-service-account --key-file=sa-key.json

      - name: Download current production report if available
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          gcloud storage cp \
            "gs://$ARTIFACT_BUCKET/artifacts/current/report.json" \
            outputs/previous-report.json || true

      - name: Check minimum F1 and regression gate
        run: |
          python src/quality_gate.py \
            --candidate outputs/report.json \
            --production outputs/previous-report.json

  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download training reports
        uses: actions/download-artifact@v4
        with:
          name: training-output-${{ github.run_id }}
          path: outputs

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.STORAGE_CREDENTIALS }}' > sa-key.json
          gcloud auth activate-service-account --key-file=sa-key.json

      - name: Promote candidate model and reports
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          CANDIDATE_KEY: ${{ needs.train.outputs.candidate_key }}
        run: |
          gcloud storage cp \
            "gs://$ARTIFACT_BUCKET/$CANDIDATE_KEY" \
            "gs://$ARTIFACT_BUCKET/artifacts/current/model.joblib"
          gcloud storage cp outputs/report.json \
            "gs://$ARTIFACT_BUCKET/artifacts/current/report.json"
          gcloud storage cp outputs/detail.txt \
            "gs://$ARTIFACT_BUCKET/artifacts/current/detail.txt"

      - name: Deploy API and verify health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            deploy_file=/tmp/income-serve-${{ github.sha }}.py
            curl -fsSL \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/src/serve.py" \
              -o "$deploy_file"
            install -m 0644 "$deploy_file" "/home/${{ secrets.SERVER_USER }}/src/serve.py"
            rm "$deploy_file"
            sudo systemctl restart income-api
            for attempt in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check passed on attempt $attempt."
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after 6 attempts."
            exit 1
